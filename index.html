<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS - San Andreas Medical Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            background-color: #05080e;
            background-image: radial-gradient(circle at 50% 0%, rgba(14, 165, 233, 0.08) 0%, transparent 60%);
            color: #f1f5f9;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card-dark {
            background: #090e17;
            border: 1px solid #162234;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .input-dark {
            background-color: #04060a;
            border: 1px solid #1e2d42;
            color: #ffffff;
        }
        .input-dark:focus {
            border-color: #0ea5e9;
            outline: none;
            box-shadow: 0 0 12px rgba(14, 165, 233, 0.3);
        }
        .btn-ems {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            font-weight: 800;
        }
        .btn-ems:hover {
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
        }
        .tab-btn {
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="p-4 md:p-6 min-h-screen">
    <div class="max-w-7xl mx-auto space-y-4">
        
        <!-- HEADER EMS -->
        <div class="card-dark p-5 rounded-2xl flex flex-wrap justify-between items-center gap-4 border-t-4 border-sky-500">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-sky-500/10 border border-sky-400/30 flex items-center justify-center text-2xl">
                    🚑
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black uppercase tracking-wider text-white">
                        SAN ANDREAS <span class="text-sky-400">EMS</span>
                    </h1>
                    <p class="text-xs text-sky-200/60 font-semibold tracking-wider uppercase">Emergencias Médicas · Tablas de Evaluación</p>
                </div>
            </div>
            <div id="userInfo" class="text-xs text-zinc-400 flex items-center gap-3"></div>
        </div>

        <!-- NAVEGACIÓN DINÁMICA (Generada por JS según Rango) -->
        <div class="flex flex-wrap items-center card-dark p-2 rounded-xl gap-2 hidden" id="navBarContenedor"></div>

        <!-- AUTH -->
        <div id="seccion-auth" class="max-w-md mx-auto card-dark p-8 rounded-2xl space-y-4 mt-10">
            <h2 class="text-xl font-black text-center text-white uppercase" id="authTitle">Acceso Médico San Andreas</h2>
            <div id="campoNombre" class="hidden">
                <label class="block text-xs font-bold text-zinc-400 mb-1">Nombre Completo</label>
                <input type="text" id="regNombre" placeholder="Dr. John Watson" class="w-full input-dark p-2.5 rounded-xl text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-zinc-400 mb-1">Usuario</label>
                <input type="text" id="authUsuario" placeholder="watson" class="w-full input-dark p-2.5 rounded-xl text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-zinc-400 mb-1">Contraseña</label>
                <input type="password" id="authPassword" placeholder="••••••••" class="w-full input-dark p-2.5 rounded-xl text-sm">
            </div>
            <button onclick="procesarAuth()" class="w-full btn-ems py-3 rounded-xl uppercase text-xs tracking-wider" id="btnAuth">Ingresar</button>
            <p class="text-center text-xs text-zinc-400 cursor-pointer hover:underline" onclick="toggleAuth()" id="toggleAuthTxt">¿No tienes cuenta? Regístrate</p>
        </div>

        <!-- SECCIONES GENERADAS DINÁMICAMENTE -->
        <div id="contenedor-secciones"></div>

        <!-- PANEL DE DIRECCIÓN (ADMIN) -->
        <div id="seccion-admin" class="card-dark p-6 rounded-2xl space-y-6 hidden">
            <div>
                <h2 class="text-xl font-black text-white uppercase">👑 Panel de Dirección General (Admin)</h2>
                <p class="text-xs text-zinc-400 mt-0.5">Asignación oficial de los rangos jerárquicos de gestión (Director, Jefes, Supervisor).</p>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="border-b border-zinc-800 text-zinc-400 uppercase">
                            <th class="p-3">Miembro</th>
                            <th class="p-3">Rango Jerárquico Oficial</th>
                            <th class="p-3">Permisos</th>
                            <th class="p-3 text-right">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTablaAdmin" class="divide-y divide-zinc-800/60"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- DATALIST PARA AUTOCOMPLETAR LOS RANGOS OFICIALES AL EVALUAR -->
    <datalist id="lista-rangos-discord">
        <option value="Especialista">
        <option value="Subespecialista">
        <option value="Residente">
        <option value="Interno/a">
        <option value="Estudiante">
        <option value="Enfermero/a Especialista">
        <option value="Enfermero/a General">
        <option value="Enfermero">
        <option value="Auxiliar de Enfermería">
        <option value="Celador/a">
    </datalist>

    <script>
        const socket = io();
        let usuarioActual = null;
        let esRegistro = false;

        // Rangos para el panel de Control Admin
        const RANGOS_EMS = [
            "Director (Admin)",
            "Subdirectora",
            "Jefa de Cirugía",
            "Jefe de Medicina",
            "Director de Enfermería",
            "Jefe de Formaciones",
            "Coordinador",
            "Supervisor"
        ];

        // Definición de las 4 Tablas Principales con sus reglas de visualización
        const DEPARTAMENTOS = [
            { 
                id: 'cirugia', 
                tituloNav: '🏥 CIRUGÍA',
                titulo: '🏥 Jefatura de Cirugía', 
                colorClases: 'border-sky-500', 
                textClases: 'text-sky-400', 
                bgClases: 'border-sky-500/20', 
                btnClases: 'bg-sky-600 hover:bg-sky-500',
                rangosPermitidos: ["Jefa de Cirugía", "Director (Admin)", "Subdirectora", "Coordinador", "Supervisor"]
            },
            { 
                id: 'medicina', 
                tituloNav: '💊 MEDICINA',
                titulo: '💊 Jefatura de Medicina', 
                colorClases: 'border-emerald-500', 
                textClases: 'text-emerald-400', 
                bgClases: 'border-emerald-500/20', 
                btnClases: 'bg-emerald-600 hover:bg-emerald-500',
                rangosPermitidos: ["Jefe de Medicina", "Director (Admin)", "Subdirectora", "Coordinador", "Supervisor"]
            },
            { 
                id: 'enfermeria', 
                tituloNav: '💉 ENFERMERÍA',
                titulo: '💉 Dirección de Enfermería', 
                colorClases: 'border-rose-500', 
                textClases: 'text-rose-400', 
                bgClases: 'border-rose-500/20', 
                btnClases: 'bg-rose-600 hover:bg-rose-500',
                rangosPermitidos: ["Director de Enfermería", "Director (Admin)", "Subdirectora", "Coordinador", "Supervisor"]
            },
            { 
                id: 'formaciones', 
                tituloNav: '📚 FORMACIONES',
                titulo: '📚 Jefatura de Formaciones', 
                colorClases: 'border-amber-500', 
                textClases: 'text-amber-400', 
                bgClases: 'border-amber-500/20', 
                btnClases: 'bg-amber-600 hover:bg-amber-500',
                rangosPermitidos: ["Jefe de Formaciones", "Director (Admin)", "Subdirectora", "Coordinador", "Supervisor"]
            }
        ];

        function inicializarEstructuraHtml() {
            const container = document.getElementById('contenedor-secciones');
            container.innerHTML = DEPARTAMENTOS.map(d => `
                <div id="seccion-${d.id}" class="hidden space-y-4">
                    <div class="card-dark p-6 rounded-2xl space-y-4 border-l-4 ${d.colorClases}">
                        <h2 class="text-lg font-black text-white uppercase border-b border-zinc-800 pb-3">${d.titulo}</h2>
                        
                        <div class="bg-black/60 p-4 rounded-xl border ${d.bgClases} grid grid-cols-1 sm:grid-cols-2 md:grid-cols-6 gap-3 text-xs">
                            <div>
                                <label class="block font-bold text-zinc-400 mb-1">Discord ID</label>
                                <input type="text" id="ascDiscord_${d.id}" placeholder="Ej. 4239841" class="w-full input-dark p-2 rounded-lg font-mono">
                            </div>
                            <div>
                                <label class="block font-bold text-zinc-400 mb-1">Nombre Evaluado</label>
                                <input type="text" id="ascNombre_${d.id}" placeholder="Ej. Juan Pérez" class="w-full input-dark p-2 rounded-lg font-bold">
                            </div>
                            <div>
                                <label class="block font-bold text-zinc-400 mb-1">Rango Actual</label>
                                <input type="text" id="ascActual_${d.id}" list="lista-rangos-discord" placeholder="Ej. Celador/a" class="w-full input-dark p-2 rounded-lg">
                            </div>
                            <div>
                                <label class="block font-bold text-zinc-400 mb-1">Rango Propuesto</label>
                                <input type="text" id="ascPropuesto_${d.id}" list="lista-rangos-discord" placeholder="Ej. Residente" class="w-full input-dark p-2 rounded-lg font-bold ${d.textClases}">
                            </div>
                            <div>
                                <label class="block font-bold text-zinc-400 mb-1">Horas Hechas</label>
                                <input type="number" id="ascHoras_${d.id}" placeholder="42" class="w-full input-dark p-2 rounded-lg text-center font-bold text-yellow-400">
                            </div>
                            <div class="flex items-end">
                                <button onclick="guardarRegistroAscenso('${d.id}')" class="w-full ${d.btnClases} text-white font-bold py-2 rounded-lg text-xs uppercase tracking-wider transition shadow">+ Agregar</button>
                            </div>
                        </div>

                        <div class="overflow-x-auto pt-2">
                            <table class="w-full text-left text-xs border-collapse">
                                <thead>
                                    <tr class="border-b border-zinc-800 text-zinc-400 uppercase">
                                        <th class="p-3">Discord ID</th>
                                        <th class="p-3">Personal a Cargo</th>
                                        <th class="p-3">Rango Actual</th>
                                        <th class="p-3">Rango Propuesto</th>
                                        <th class="p-3 text-center">Horas Hechas</th>
                                        <th class="p-3">Evaluado Por</th>
                                        <th class="p-3 text-right">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="cuerpoTabla_${d.id}" class="divide-y divide-zinc-800/60"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        inicializarEstructuraHtml();

        function toggleAuth() {
            esRegistro = !esRegistro;
            document.getElementById('campoNombre').classList.toggle('hidden', !esRegistro);
            document.getElementById('authTitle').innerText = esRegistro ? 'Registro Personal EMS' : 'Acceso Médico San Andreas';
            document.getElementById('btnAuth').innerText = esRegistro ? 'Crear Cuenta' : 'Ingresar';
            document.getElementById('toggleAuthTxt').innerText = esRegistro ? '¿Ya tienes cuenta? Ingresa' : '¿No tienes cuenta? Regístrate';
        }

        async function procesarAuth() {
            const usuario = document.getElementById('authUsuario').value.trim();
            const password = document.getElementById('authPassword').value.trim();

            if (esRegistro) {
                const nombre = document.getElementById('regNombre').value.trim();
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, usuario, password })
                });
                const data = await res.json();
                if (res.ok) {
                    alert("Cuenta creada con éxito. Ahora puedes iniciar sesión.");
                    toggleAuth();
                } else alert(data.error);
            } else {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });
                const data = await res.json();
                if (res.ok) {
                    usuarioActual = data;
                    actualizarUIUsuario();
                } else alert(data.error);
            }
        }

        function actualizarUIUsuario() {
            if (!usuarioActual) return;
            
            document.getElementById('seccion-auth').classList.add('hidden');
            const nav = document.getElementById('navBarContenedor');
            nav.classList.remove('hidden');

            document.getElementById('userInfo').innerHTML = `
                <span>👨‍⚕️ <strong class="text-sky-400">${usuarioActual.nombre}</strong></span>
                <span class="bg-sky-500/20 text-sky-300 px-2 py-0.5 rounded text-[10px] font-bold uppercase border border-sky-500/30">${usuarioActual.rango}</span>
                <button onclick="location.reload()" class="text-rose-400 hover:underline ml-2 font-bold">Salir</button>
            `;

            const esAdmin = usuarioActual.rol === 'admin' || usuarioActual.rango === 'Director (Admin)';
            let pestanaAInicializar = null;
            let navBotonesHTML = '';

            // Construcción Dinámica de Pestañas permitidas para el rango del usuario
            DEPARTAMENTOS.forEach(d => {
                const tieneAcceso = esAdmin || d.rangosPermitidos.includes(usuarioActual.rango);
                if (tieneAcceso) {
                    navBotonesHTML += `<button onclick="cambiarPestana('${d.id}')" id="tab-${d.id}" class="tab-btn px-4 py-2 rounded-lg font-bold text-xs bg-zinc-900 ${d.textClases}">${d.tituloNav}</button>`;
                    if (!pestanaAInicializar) pestanaAInicializar = d.id;
                }
            });

            if (esAdmin) {
                navBotonesHTML += `<button onclick="cambiarPestana('admin')" id="tab-admin" class="tab-btn px-4 py-2 rounded-lg font-bold text-xs bg-zinc-900 text-rose-400">👑 PANEL ADMIN</button>`;
            }

            nav.innerHTML = navBotonesHTML;

            // Cargar datos y forzar la vista de la primera pestaña que el usuario tenga permitida
            cargarTablasVisibles();
            if (pestanaAInicializar) {
                cambiarPestana(pestanaAInicializar);
            } else if (esAdmin) {
                cambiarPestana('admin');
            }

            socket.emit('user_connected', usuarioActual);
        }

        function cambiarPestana(pestana) {
            const todas = [...DEPARTAMENTOS.map(d => d.id), 'admin'];
            
            todas.forEach(p => {
                const sec = document.getElementById(`seccion-${p}`);
                if(sec) sec.classList.add('hidden');
                
                const btn = document.getElementById(`tab-${p}`);
                if(btn) {
                    btn.classList.remove('btn-ems');
                    btn.classList.add('bg-zinc-900');
                }
            });

            const sectionActiva = document.getElementById(`seccion-${pestana}`);
            if(sectionActiva) sectionActiva.classList.remove('hidden');

            const btnActivo = document.getElementById(`tab-${pestana}`);
            if(btnActivo) {
                btnActivo.classList.remove('bg-zinc-900');
                btnActivo.classList.add('btn-ems');
            }

            if (pestana === 'admin') cargarGestionAdmin();
        }

        async function cargarTablasVisibles() {
            const res = await fetch('/api/ascensos');
            const listaCompleta = await res.json();

            DEPARTAMENTOS.forEach(d => {
                const filtrados = listaCompleta.filter(item => item.jefatura === d.id);
                const cuerpo = document.getElementById(`cuerpoTabla_${d.id}`);
                
                if (filtrados.length === 0) {
                    cuerpo.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-zinc-500 italic">No hay registros en esta jefatura.</td></tr>`;
                    return;
                }

                cuerpo.innerHTML = filtrados.map(item => `
                    <tr class="hover:bg-zinc-900/40 border-b border-zinc-800/40">
                        <td class="p-3 font-mono text-zinc-400">${item.discord_id}</td>
                        <td class="p-3 font-bold text-white">${item.nombre_ems}</td>
                        <td class="p-3 text-zinc-300">${item.rango_actual}</td>
                        <td class="p-3 font-bold ${d.textClases}">${item.rango_propuesto}</td>
                        <td class="p-3 text-center font-bold text-yellow-400">${item.horas_hechas} hrs</td>
                        <td class="p-3 text-zinc-500 text-[11px]">${item.actualizado_por}</td>
                        <td class="p-3 text-right">
                            <button onclick="eliminarAscenso(${item.id})" class="text-rose-400 hover:text-rose-300 font-bold bg-rose-500/10 px-2 py-1 rounded border border-rose-500/20">Retirar</button>
                        </td>
                    </tr>
                `).join('');
            });
        }

        async function guardarRegistroAscenso(jefaturaId) {
            const discord_id = document.getElementById(`ascDiscord_${jefaturaId}`).value.trim();
            const nombre_ems = document.getElementById(`ascNombre_${jefaturaId}`).value.trim();
            const rango_actual = document.getElementById(`ascActual_${jefaturaId}`).value.trim();
            const rango_propuesto = document.getElementById(`ascPropuesto_${jefaturaId}`).value.trim();
            const horas_hechas = document.getElementById(`ascHoras_${jefaturaId}`).value;

            if (!discord_id || !nombre_ems) return alert("Ingresa ID de Discord y Nombre.");

            const res = await fetch('/api/ascensos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    jefatura: jefaturaId,
                    discord_id,
                    nombre_ems,
                    rango_actual,
                    rango_propuesto,
                    horas_hechas,
                    actualizado_por: usuarioActual ? usuarioActual.nombre : 'Jefatura'
                })
            });

            if (res.ok) {
                document.getElementById(`ascDiscord_${jefaturaId}`).value = '';
                document.getElementById(`ascNombre_${jefaturaId}`).value = '';
                document.getElementById(`ascActual_${jefaturaId}`).value = '';
                document.getElementById(`ascPropuesto_${jefaturaId}`).value = '';
                document.getElementById(`ascHoras_${jefaturaId}`).value = '';
                cargarTablasVisibles();
            } else {
                const data = await res.json();
                alert(data.error);
            }
        }

        async function eliminarAscenso(id) {
            if (!confirm("¿Eliminar este registro de evaluación?")) return;
            await fetch(`/api/ascensos/${id}`, { method: 'DELETE' });
            cargarTablasVisibles();
        }

        // PANEL ADMIN
        async function cargarGestionAdmin() {
            const res = await fetch('/api/usuarios');
            const usuarios = await res.json();
            const cuerpo = document.getElementById('cuerpoTablaAdmin');

            cuerpo.innerHTML = usuarios.map(u => `
                <tr class="hover:bg-zinc-900/40 border-b border-zinc-800/40">
                    <td class="p-3 font-bold text-white">${u.nombre} <span class="text-zinc-500 font-normal">(@${u.usuario})</span></td>
                    <td class="p-3">
                        <select id="selRangoAdmin-${u.id}" class="input-dark p-1.5 rounded-lg text-xs font-bold text-sky-300">
                            ${RANGOS_EMS.map(r => `<option value="${r}" ${u.rango === r ? 'selected' : ''}>${r}</option>`).join('')}
                        </select>
                    </td>
                    <td class="p-3">
                        <select id="selRolAdmin-${u.id}" class="input-dark p-1.5 rounded-lg text-xs">
                            <option value="empleado" ${u.rol === 'empleado' ? 'selected' : ''}>Personal</option>
                            <option value="admin" ${u.rol === 'admin' ? 'selected' : ''}>Administrador</option>
                        </select>
                    </td>
                    <td class="p-3 text-right">
                        <button onclick="guardarAdminUsuario(${u.id})" class="btn-ems px-3 py-1.5 rounded-lg text-xs shadow">Guardar</button>
                    </td>
                </tr>
            `).join('');
        }

        async function guardarAdminUsuario(id) {
            const rango = document.getElementById(`selRangoAdmin-${id}`).value;
            const rol = document.getElementById(`selRolAdmin-${id}`).value;
            await fetch(`/api/usuarios/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rango, rol }) 
            });
            alert("Rango y permisos actualizados correctamente.");
        }

        socket.on('db_update', (d) => {
            if (d.evento === 'ascensos_actualizados') cargarTablasVisibles();
        });

    </script>
</body>
</html>
